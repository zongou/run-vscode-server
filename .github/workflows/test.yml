name: Test action
on:
  push:
    paths:
      - action.yml
      - .github/workflows/test.yml
  pull_request:
  workflow_dispatch:
    inputs:
      settings:
        default: |
          {
            "workbench.colorTheme": "Default Dark Modern"
          }
        required: false
        type: string
      insider:
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-latest-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@main
      - uses: ./
        with:
          settings: ${{ inputs.settings || '{}' }}
          insider: ${{ inputs.insider || false }}

      - name: Keep alive 
        run: sleep 5m
